<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ninja Cat: The Whiskered Realm (Full Game + Cute UI)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { margin: 0; background: #0c0a15; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: #110e1b; display: flex; justify-content: center; align-items: center; }
        canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 5; }
        
        .hud-row-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .player-profile { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.95); border: 4px solid #fff; border-radius: 20px; padding: 8px 16px 8px 8px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); pointer-events: auto; }
        .portrait-box { width: 68px; height: 68px; background: linear-gradient(180deg, #90e0ef, #00b4d8); border: 3px solid #fff; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .portrait-box img { width: 90%; height: auto; object-fit: contain; margin-top: 5px; }
        .status-bars { display: flex; flex-direction: column; gap: 6px; min-width: 160px; position: relative; }
        .level-badge { position: absolute; top: -18px; right: -12px; background: #ffb703; color: #fff; font-weight: 900; font-size: 14px; padding: 4px 10px; border-radius: 12px; border: 3px solid #fff; }
        .bar-wrapper { display: flex; align-items: center; gap: 8px; }
        .bar-icon { font-size: 12px; font-weight: 900; color: #fff; background: #e63946; padding: 2px 6px; border-radius: 6px; }
        .bar-icon.mp-icon { background: #4361ee; }
        .bar-container { flex-grow: 1; height: 18px; background: #e9ecef; border-radius: 9px; border: 2px solid #ced4da; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; position: absolute; top:0; left:0; border-radius: 7px; transition: width 0.15s ease-out; }
        #hp-fill { background: linear-gradient(180deg, #ff4d6d, #c9184a); }
        #mp-fill { background: linear-gradient(180deg, #4cc9f0, #0077b6); }
        .lives-container { display: flex; gap: 4px; margin-top: 4px; }
        .pink-paw-icon { font-size: 16px; color: #ff477e; }
        .empty-paw-icon { font-size: 16px; color: #dee2e6; }
        .hud-coins { margin-top: 12px; font-size: 18px; color: #fff; font-weight: 900; text-shadow: -1px -1px 0 #000, 1px 1px 0 #000; }

        .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 10, 21, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; pointer-events: auto; }
        .menu-btn { background: linear-gradient(180deg, #ffd166, #ffb703); color: #fff; border: 4px solid #fff; padding: 14px 36px; border-radius: 16px; font-size: 20px; font-weight: 900; cursor: pointer; margin: 10px; pointer-events: auto; text-shadow: 1px 1px 0 rgba(0,0,0,0.3); }
        
        #touch-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }
        .touch-cluster-left { position: absolute; bottom: 40px; left: 40px; pointer-events: auto; }
        .dpad-container { position: relative; width: 180px; height: 140px; }
        .dpad-btn { position: absolute; width: 65px; height: 65px; border-radius: 50%; font-size: 28px; font-weight: bold; background: rgba(255, 255, 255, 0.85); border: 4px solid #fff; display: flex; align-items: center; justify-content: center; color: #4ea8de; }
        .dpad-btn:active { transform: scale(0.92); }
        .dpad-up { bottom: 80px; left: 55px; } .dpad-left { bottom: 0px; left: 0px; } .dpad-right { bottom: 0px; left: 110px; }

        .touch-cluster-right { position: absolute; bottom: 40px; right: 40px; pointer-events: auto; }
        .paw-container { position: relative; width: 200px; height: 200px; }
        .touch-btn { background: #fff; border: 4px solid #fff; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .touch-btn:active { transform: scale(0.92); }
        .paw-toe { position: absolute; width: 55px; height: 55px; }
        .paw-pad { position: absolute; width: 85px; height: 75px; border-radius: 40% 40% 50% 50% / 50% 50% 40% 40%; bottom: 0px; left: 57px; background: #ffb703; }
        .toe-x { bottom: 85px; left: 5px; background: #ff4d6d; }
        .toe-c { bottom: 140px; left: 35px; background: #4cc9f0; }
        .toe-v { bottom: 140px; left: 110px; background: #9d4edd; }
        .toe-b { bottom: 85px; left: 140px; background: #06d6a0; }
        .touch-btn .icon-symbol { font-size: 26px; } .paw-pad .icon-symbol { font-size: 38px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-overlay" class="hidden">
        <div class="hud-row-top">
            <div class="hud-left">
                <div class="player-profile">
                    <div class="portrait-box"><img src="cat.png" alt="Cat"></div>
                    <div class="status-bars">
                        <div class="level-badge" id="hud-level">LV 1</div>
                        <div class="bar-wrapper"><span class="bar-icon">HP</span><div class="bar-container"><div id="hp-fill" class="bar-fill"></div></div></div>
                        <div class="bar-wrapper"><span class="bar-icon mp-icon">MP</span><div class="bar-container"><div id="mp-fill" class="bar-fill"></div></div></div>
                        <div class="lives-container" id="hud-lives-icons"></div>
                    </div>
                </div>
                <div class="hud-coins">🪙 <span id="hud-coins-val">0</span></div>
            </div>
            <div class="hud-right">
                <button class="menu-btn" style="padding: 8px 16px; font-size: 14px;" onclick="location.reload()">⏸️ MENU</button>
            </div>
        </div>

        <div id="touch-controls">
            <div class="touch-cluster-left">
                <div class="dpad-container">
                    <div class="dpad-btn dpad-up" id="btn-up">▲</div>
                    <div class="dpad-btn dpad-left" id="btn-left">◀</div>
                    <div class="dpad-btn dpad-right" id="btn-right">▶</div>
                </div>
            </div>
            <div class="touch-cluster-right">
                <div class="paw-container">
                    <div class="touch-btn paw-toe toe-x" id="btn-x"><span class="icon-symbol">🔨</span></div>
                    <div class="touch-btn paw-toe toe-c" id="btn-c"><span class="icon-symbol">🗡️</span></div>
                    <div class="touch-btn paw-toe toe-v" id="btn-v"><span class="icon-symbol">🔔</span></div>
                    <div class="touch-btn paw-toe toe-b" id="btn-b"><span class="icon-symbol">🌀</span></div>
                    <div class="touch-btn paw-pad" id="btn-z"><span class="icon-symbol">🐾</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="screen-overlay">
        <h1 style="font-size: 64px; color: #fff; text-shadow: 0 6px 0 #ffb703; margin-bottom: 20px;">NINJA CAT</h1>
        <div style="display: flex; gap: 20px; margin-bottom: 30px;">
            <button class="menu-btn" style="background:#4ea8de;" onclick="gamePlatform='mobile'; this.style.opacity='0.5'">📱 Mobile</button>
            <button class="menu-btn" style="background:#06d6a0;" onclick="gamePlatform='pc'; this.style.opacity='0.5'">🖥️ PC</button>
        </div>
        <button class="menu-btn" style="font-size: 28px; padding: 18px 48px;" onclick="startGame()">PLAY GAME</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const LOGICAL_WIDTH = 720; const LOGICAL_HEIGHT = 405;

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const screenW = window.innerWidth; const screenH = window.innerHeight;
        let renderW = screenW; let renderH = screenW * (9/16);
        if (renderH > screenH) { renderH = screenH; renderW = screenH * (16/9); }
        canvas.width = renderW * dpr; canvas.height = renderH * dpr;
        ctx.scale((renderW * dpr) / LOGICAL_WIDTH, (renderH * dpr) / LOGICAL_HEIGHT);
    }
    resizeCanvas(); window.addEventListener('resize', resizeCanvas);

    let gameState = 'MENU';
    let gamePlatform = 'mobile';
    let player = { x: 150, y: 275, width: 70, height: 70, vx: 0, vy: 0, speed: 4.5, jumpPower: -11, gravity: 0.55, grounded: false, facingRight: true, lives: 9, maxHp: 100, hp: 100, maxMp: 50, mp: 50, atk: 15, level: 1, coins: 0, dashTimer: 0, isAttacking: false };
    let enemies = []; let worldOffset = 0; let frameCount = 0;

    const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false };
    let lastTap = { left: 0, right: 0 };

    window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.code)) keys[e.code] = true; });
    window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.code)) keys[e.code] = false; });

    ['btn-left', 'btn-right', 'btn-up'].forEach(id => {
        const btn = document.getElementById(id);
        const keyMap = { 'btn-left':'ArrowLeft', 'btn-right':'ArrowRight', 'btn-up':'ArrowUp' };
        btn.addEventListener('touchstart', e => { 
            e.preventDefault(); keys[keyMap[id]] = true; btn.style.transform = 'scale(0.92)';
            if(id === 'btn-left' || id === 'btn-right') {
                let now = Date.now(); let dir = id === 'btn-left' ? 'left' : 'right';
                if(now - lastTap[dir] < 250) { player.dashTimer = 15; player.vx = dir === 'left' ? -10 : 10; }
                lastTap[dir] = now;
            }
        });
        btn.addEventListener('touchend', e => { e.preventDefault(); keys[keyMap[id]] = false; btn.style.transform = 'scale(1)'; });
    });

    ['btn-z', 'btn-x', 'btn-c', 'btn-v', 'btn-b'].forEach(id => {
        document.getElementById(id).addEventListener('touchstart', e => { e.preventDefault(); executeAttack(); });
    });

    function startGame() {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('ui-overlay').classList.remove('hidden');
        document.getElementById('touch-controls').classList.toggle('hidden', gamePlatform === 'pc');
        gameState = 'PLAYING';
    }

    function executeAttack() {
        if(player.isAttacking) return;
        player.isAttacking = true;
        setTimeout(() => player.isAttacking = false, 300);
        
        let hitBoxX = player.facingRight ? player.x + 70 : player.x - 50;
        enemies.forEach(en => {
            let enScreenX = en.x - worldOffset;
            if(Math.abs(hitBoxX - enScreenX) < 60) {
                en.hp -= player.atk;
                if(en.hp <= 0) { en.dead = true; player.coins += 5; }
            }
        });
    }

    function updateGame() {
        if(gameState !== 'PLAYING') return;
        frameCount++;

        let moveSpeed = player.dashTimer > 0 ? 10 : player.speed;
        if(player.dashTimer > 0) player.dashTimer--;

        if (keys.ArrowLeft) { player.facingRight = false; if(player.x > 100) player.x -= moveSpeed; else worldOffset -= moveSpeed; }
        if (keys.ArrowRight) { player.facingRight = true; if(player.x < 300) player.x += moveSpeed; else worldOffset += moveSpeed; }
        if (keys.ArrowUp && player.grounded) { player.vy = player.jumpPower; player.grounded = false; }
        
        player.vy += player.gravity; player.y += player.vy;
        if (player.y + player.height > 345) { player.y = 345 - player.height; player.vy = 0; player.grounded = true; }

        if(frameCount % 100 === 0) {
            enemies.push({ x: worldOffset + 800, y: 300, width: 50, height: 50, hp: 30, speed: 1.5, type: Math.random() > 0.5 ? 'A' : 'B' });
        }

        enemies.forEach(en => { en.x -= en.speed; });
        enemies = enemies.filter(en => !en.dead && en.x > worldOffset - 100);

        document.getElementById('hp-fill').style.width = `${(player.hp/player.maxHp)*100}%`;
        document.getElementById('mp-fill').style.width = `${(player.mp/player.maxMp)*100}%`;
        document.getElementById('hud-coins-val').innerText = player.coins;
        
        let livesHtml = '';
        for(let i=0; i<9; i++) livesHtml += i < player.lives ? '<span class="pink-paw-icon">🐾</span>' : '<span class="empty-paw-icon">🐾</span>';
        document.getElementById('hud-lives-icons').innerHTML = livesHtml;
    }

    function render() {
        ctx.clearRect(0,0,720,405);
        if(gameState !== 'PLAYING') return;
        
        let bgScroll = (worldOffset * 0.5) % 720;
        ctx.fillStyle = '#90e0ef'; ctx.fillRect(0,0,720,405);
        ctx.fillStyle = '#74c69d'; ctx.fillRect(0,345,720,60);
        ctx.fillStyle = '#caf0f8'; ctx.fillRect(-bgScroll, 200, 200, 150); ctx.fillRect(-bgScroll + 400, 150, 250, 200); ctx.fillRect(-bgScroll + 800, 200, 200, 150);

        ctx.save();
        let rX = player.x; if(!player.facingRight) { ctx.scale(-1, 1); rX = -player.x - player.width; }
        ctx.fillStyle = '#ffb703'; ctx.beginPath(); ctx.roundRect(rX, player.y, player.width, player.height, 16); ctx.fill();
        
        if(player.isAttacking) {
            ctx.fillStyle = '#ff4d6d';
            ctx.fillRect(player.facingRight ? rX + 70 : rX - 30, player.y + 20, 30, 10);
        }
        ctx.restore();

        enemies.forEach(en => {
            let screenX = en.x - worldOffset;
            ctx.fillStyle = en.type === 'A' ? '#ff9999' : '#c19a6b';
            ctx.beginPath(); ctx.arc(screenX + 25, en.y + 25 + Math.sin(frameCount/10)*5, 25, 0, Math.PI*2); ctx.fill();
        });
    }

    function mainLoop() { updateGame(); render(); requestAnimationFrame(mainLoop); }
    mainLoop();
</script>
</body>
</html>
